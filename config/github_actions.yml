daily:
  schedule:
    - "0 0 * * 6"
  options:
    market:
      default: ALL
      choices:
        - ALL
        - KR
        - US
    dry_run:
      default: false
    publish_pages:
      default: true

manual:
  options:
    market:
      default: ALL
      choices:
        - ALL
        - KR
        - US
    dry_run:
      default: true
    publish_pages:
      default: false

keepalive:
  schedule:
    - "0 6 * * 1"
  options:
    inactivity_days: 50
    marker_file: ".github/keepalive.txt"
    commit_message: "chore(keepalive): keep scheduled workflows enabled"
