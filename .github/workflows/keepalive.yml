# This file is generated from config/github_actions.yml.
# Run `python -m watchlist_signal_bot.github_actions` after changing that config.
# Do not edit this file manually.

name: "Keepalive Bot Commit"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even when the repository is still active"
        required: false
        default: false
        type: "boolean"

permissions:
  contents: "write"

concurrency:
  group: "keepalive-bot-commit"
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: "ubuntu-latest"
    env:
      INACTIVITY_DAYS: 50
      MARKER_FILE: ".github/keepalive.txt"
      COMMIT_MESSAGE: "chore(keepalive): keep scheduled workflows enabled"
      FORCE: ${{ github.event.inputs.force || 'false' }}
      BOT_NAME: "github-actions[bot]"
      BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Create keepalive bot commit"
        shell: "bash"
        run: |
          set -euo pipefail
          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date -u +%s)"
          idle_days=$(( (now_epoch - last_commit_epoch) / 86400 ))
          echo "Days since last commit: ${idle_days}"
          if [[ "${FORCE}" != "true" && "${idle_days}" -lt "${INACTIVITY_DAYS}" ]]; then
            echo "Repository is still active. Skipping keepalive commit."
            exit 0
          fi
          mkdir -p "$(dirname "${MARKER_FILE}")"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "${MARKER_FILE}"
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"
          git add "${MARKER_FILE}"
          if git diff --cached --quiet; then
            echo "Marker file is unchanged. Nothing to commit."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
